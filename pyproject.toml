[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
tlf-geo-profiler = { workspace = true }

[project]
name = "tlf-profilers"
version = "0.0.0"
description = "Monorepo for TLF's three civic-data profilers: regional/demographic, disaster/amenity, and database."
requires-python = ">=3.10"
dependencies = [
    "geopandas>=1.1.4",
    "pytest>=9.1.1",
    "tlf-geo-profiler",
]
