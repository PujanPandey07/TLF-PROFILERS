[project]
name = "tlf-geo-profiler"
version = "0.1.0"
description = "Coordinate -> Nepal administrative unit + demographic profile"
requires-python = ">=3.10"
dependencies = [
    "shapely>=2.0",
    "geopandas>=1.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tlf_geo_profiler"]

[tool.hatch.build.targets.wheel.force-include]
"src/tlf_geo_profiler/data/wards.parquet" = "tlf_geo_profiler/data/wards.parquet"
